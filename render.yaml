services:
  # GovMesh Backend API Gateway & Federated Microservices
  - type: web
    name: govmesh-backend
    runtime: python
    region: ohio
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: bash start_render.sh
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: DEMO_CONTROLS_ENABLED
        value: "true"
      - key: DEMO_CONTROL_KEY
        value: "govmesh-demo-control-2026"

  # GovMesh Frontend Web Application (Static Site)
  - type: web
    name: govmesh-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://govmesh-backend.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

